// --- UTILITY ---
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function slackChannelName(no,name){return(no+"-"+name).toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");}
function guessBody(t){const l=t.toLowerCase();for(const r of BLOCK_RULES)if(r.kw.some(k=>l.includes(k)))return r;return null;}
function filterCat(codes,cat){
  const baby=["ST144","ST71-2","ST1737","ST1926","ST296","ST304"];
  const kids=["ST38","ST77","ST95","ST127","ST028","ST43","ST71-1","FR1722"];
  const teen=["ST173","ST269","FR1730","ST1","NELLIE-PJ","SFCDP","SCT","PR1927"];
  const map={Baby:baby,Boys:kids,Girls:kids,Preteen:[...kids,...teen],Teen:teen};
  return codes.filter(c=>(map[cat]||[]).includes(c));
}
function getDetails(t){return DETAIL_KW.filter(k=>t.toLowerCase().includes(k));}

// --- API ---
async function callClaude(messages,system){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,
      system:system||"You are a professional kidswear tech pack assistant. Be concise and technical. No markdown.",messages}),
  });
  const d=await r.json();
  return d.content?.[0]?.text||"";
}
async function geminiCall(contents,generationConfig){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key="+CFG.GEMINI_KEY,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents,generationConfig}),
  });
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
}
function geminiText(p){return geminiCall([{parts:[{text:p}]}],{temperature:0.4,maxOutputTokens:700});}
function geminiVision(b64,mime,p){return geminiCall([{parts:[{inline_data:{mime_type:mime,data:b64}},{text:p}]}],{temperature:0.2,maxOutputTokens:500});}

// --- SLACK API ---
async function slackGET(endpoint,params={}){
  const qs=new URLSearchParams(params).toString();
  const r=await fetch(`https://slack.com/api/${endpoint}${qs?"?"+qs:""}`,{
    headers:{"Authorization":"Bearer "+CFG.SLACK_TOKEN},
  });
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||endpoint+" failed");
  return d;
}
async function slackPOST(endpoint,body){
  const r=await fetch("https://slack.com/api/"+endpoint,{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.SLACK_TOKEN},
    body:JSON.stringify(body),
  });
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||endpoint+" failed");
  return d;
}
async function slackFindChannel(nameOrId){
  if(/^[CG][A-Z0-9]{6,}$/.test(nameOrId))return nameOrId;
  const name=nameOrId.replace(/^#/,"");
  const d=await slackGET("conversations.list",{limit:200,exclude_archived:true,types:"public_channel,private_channel"});
  const ch=(d.channels||[]).find(c=>c.name===name);
  if(!ch)throw new Error(`Channel #${name} not found — check the bot token has access.`);
  return ch.id;
}
async function slackGetHistory(channelId,oldest){
  const d=await slackGET("conversations.history",{channel:channelId,oldest:oldest||"0",limit:20,inclusive:false});
  return([...(d.messages||[])].reverse());
}
async function slackCreateOrFindChannel(name){
  try{
    const d=await slackPOST("conversations.create",{name,is_private:false});
    return d.channel.id;
  }catch(e){
    if(e.message==="name_taken")return slackFindChannel(name);
    throw e;
  }
}
async function slackPostMessage(channel,text,blocks){
  return slackPOST("chat.postMessage",{channel,text,...(blocks?{blocks}:{})});
}
async function slackCreateCanvas(channelId,title,markdown){
  const d=await slackPOST("canvases.create",{
    channel_id:channelId,title,
    document_content:{type:"markdown",markdown},
  });
  return d.canvas_id;
}
async function slackDownloadAsB64(urlPrivate){
  const r=await fetch(urlPrivate,{headers:{"Authorization":"Bearer "+CFG.SLACK_TOKEN}});
  if(!r.ok)throw new Error("File download failed: "+r.status);
  const blob=await r.blob();
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res({b64:rd.result.split(",")[1],mime:blob.type});
    rd.onerror=rej;
    rd.readAsDataURL(blob);
  });
}

// --- SAMPLE PARSING ---
async function parseSampleMessage(text){
  const r=await callClaude([{role:"user",content:`Extract tech pack sample details from this Slack message. Return valid JSON only — no markdown, no explanation.

{
  "sampleNo": "",
  "styleName": "",
  "brand": "",
  "cat": "",
  "sz": "",
  "season": "",
  "colorway": "",
  "desc": ""
}

Available brands: Sweet Threads, Froo, Soiree, Prairie
Available categories: Baby, Boys, Girls, Preteen, Teen
Sizes: 6M 9M 12M 18M 24M 2Y 3Y 4Y 5Y 6Y 7Y 8Y 10Y or numeric 10 12 14 16 18 20

If a field is unclear, leave it empty. Put the full garment description in "desc".

Message:
${text.slice(0,2000)}`}]);
  try{
    const m=r.match(/\{[\s\S]*?\}/);
    if(m)return JSON.parse(m[0]);
  }catch(e){}
  return null;
}

// --- TECH PACK BUILDER ---
async function buildTechPack(sample,logFn){
  logFn("sketch");
  const prompt=await callClaude([{role:"user",content:
    `Write a concise technical sketch prompt (max 80 words) for:\n${sample.styleName} - ${sample.desc}\nBrand: ${sample.brand} | Category: ${sample.cat}\nInclude: garment type, silhouette, key construction details, front and back views. Return only the prompt text.`
  }]).catch(()=>"Technical flat sketch: "+sample.styleName+". "+sample.desc);

  logFn("descriptions");
  const [skDesc,mkDesc]=await Promise.all([
    geminiText(`Fashion technical sketch expert.\nGarment: ${prompt}\n\nTechnical sketch notes:\n1. FRONT VIEW - silhouette, neckline, sleeves, bodice, hemline, closures, pockets, trims\n2. BACK VIEW - neckline, closure, construction\n3. KEY DETAILS - seams, topstitching, gathering, pleats\nMax 200 words.`).catch(()=>""),
    (sample.inspoB64
      ?geminiVision(sample.inspoB64,sample.inspoMime,`Fabric/garment for: ${sample.styleName} - ${sample.desc}\nDescribe 3D mockup on children's mannequin:\n1. FRONT VIEW\n2. BACK VIEW\n3. OVERALL fit\nMax 180 words.`)
      :geminiText(`3D fashion mockup for: ${sample.styleName} - ${sample.desc}\n1. FRONT VIEW on mannequin\n2. BACK VIEW\n3. OVERALL\nMax 180 words.`)
    ).catch(()=>""),
  ]);

  let inspoAnalysis="",callouts=[];
  if(sample.inspoB64){
    logFn("image");
    const details=getDetails(sample.desc||"");
    const [analysis,...coDescs]=await Promise.all([
      geminiVision(sample.inspoB64,sample.inspoMime,"Describe this fashion inspiration image: garment, silhouette, colours, key design features, fabric, special details. Max 150 words.").catch(()=>""),
      ...details.slice(0,4).map(d=>
        geminiVision(sample.inspoB64,sample.inspoMime,`Focus on the ${d} detail. Describe for factory: technique, placement, dimensions, colour, construction. Max 60 words.`).catch(()=>"")
      ),
    ]);
    inspoAnalysis=analysis;
    callouts=details.slice(0,4).map((d,i)=>({label:d,desc:coDescs[i]||""}));
  }

  logFn("chart");
  const rule=guessBody((sample.desc||"")+" "+(sample.styleName||""));
  let chart=null;
  if(rule){
    const filtered=filterCat(rule.codes,sample.cat);
    const code=filtered[0]||rule.codes[0];
    chart=CHART_LIB.find(x=>x.code===code)||null;
  }

  logFn("notes");
  const notes=await callClaude([{role:"user",content:
    `Generate 10 precise factory bullet-point notes:\nStyle: ${sample.styleName} (${sample.sampleNo})\nBrand: ${sample.brand} | ${sample.cat} | Size ${sample.sz} | ${sample.season}\nColorway: ${sample.colorway||"N/A"}\nDescription: ${sample.desc}\nCover: silhouette, fabric, construction, closures, trims, hem, special details. Number each point.`
  }]).catch(()=>"Factory notes unavailable.");

  return{prompt,skDesc,mkDesc,inspoAnalysis,callouts,chart,notes};
}

function buildCanvasMarkdown(sample,tp){
  const date=new Date().toLocaleDateString("en-GB");
  let md=`# ${(sample.brand||"").toUpperCase()} — ${sample.sampleNo} ${(sample.styleName||"").toUpperCase()}

**Tech Pack** | ${sample.season||""} | ${date}

---

## Sample Information

| Field | Value |
|---|---|
| Sample No | ${sample.sampleNo||"--"} |
| Style Name | ${sample.styleName||"--"} |
| Brand | ${sample.brand||"--"} |
| Category | ${sample.cat||"--"} |
| Sample Size | ${sample.sz||"--"} |
| Season | ${sample.season||"--"} |
| Colorway | ${sample.colorway||"--"} |
| Date | ${date} |

---

## Design Description

${sample.desc||"--"}

---

## Technical Sketch Notes

${tp.skDesc||"See attached sketch files."}

---

## 3D Mockup Description

${tp.mkDesc||"See attached mockup files."}`;

  if(tp.inspoAnalysis){
    md+=`\n\n---\n\n## Inspiration Image Analysis\n\n${tp.inspoAnalysis}`;
  }
  if(tp.callouts&&tp.callouts.some(c=>c.desc)){
    md+=`\n\n---\n\n## Detail Callouts\n\n`;
    tp.callouts.filter(c=>c.desc).forEach(c=>{md+=`**${c.label.toUpperCase()}:** ${c.desc}\n\n`;});
  }
  md+=`\n\n---\n\n## Factory Notes\n\n${tp.notes||"--"}`;
  if(tp.chart){
    md+=`\n\n---\n\n## Recommended Size Chart\n\n**${tp.chart.name}** (${tp.chart.code}) — sizes ${tp.chart.sizes}\n\n**Sample Size:** ${sample.sz||"--"}`;
  }
  md+=`\n\n---\n\n*Generated by FROO.studio Tech Pack Bot*`;
  return md;
}

// --- COMPONENTS ---
function Dots(){
  return <div className="dts"><span/><span/><span/></div>;
}

const STEP_DEFS=[
  {key:"sketch",label:"Build sketch prompt"},
  {key:"descriptions",label:"Generate technical descriptions"},
  {key:"image",label:"Analyse inspiration image"},
  {key:"chart",label:"Select size chart"},
  {key:"notes",label:"Generate factory notes"},
  {key:"channel",label:"Create Slack channel"},
  {key:"canvas",label:"Create canvas & post"},
];

function MsgBubble({msg}){
  const time=new Date(msg.ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if(msg.role==="system")return(
    <div className="msg system">
      <div className="msg-bubble">{msg.text}</div>
    </div>
  );
  const isBot=msg.role==="bot";
  const activeSteps=msg.steps&&msg.steps.length>0;
  return(
    <div className={"msg "+msg.role}>
      {isBot&&<div className="msg-avatar" style={{color:G}}>F</div>}
      <div className="msg-wrap" style={!isBot?{marginLeft:"auto"}:{}}>
        <div className="msg-label">{isBot?"FROO Bot":"You"}</div>
        <div className="msg-bubble">
          {msg.loading&&!msg.text&&<Dots/>}
          {msg.text&&<span>{msg.text}</span>}
          {activeSteps&&<div className="steps">
            {STEP_DEFS.filter(d=>msg.steps[d.key]!==undefined||(msg.activeStep===d.key)).map(d=>{
              const st=msg.steps[d.key]||"pending";
              const isActive=msg.activeStep===d.key;
              return(
                <div key={d.key} className={"step-row "+(isActive?"active":st)}>
                  <span className="step-icon">{st==="done"?"✓":isActive?"▸":"○"}</span>
                  <span>{d.label}</span>
                  {isActive&&<Dots/>}
                </div>
              );
            })}
          </div>}
        </div>
        <div className="msg-time">{time}</div>
      </div>
      {!isBot&&<div className="msg-avatar" style={{color:"#363636"}}>U</div>}
    </div>
  );
}

function SampleItem({item,active,onClick}){
  return(
    <div className={"sq-item"+(active?" active":"")+" "+item.status} onClick={onClick}>
      <div className="sq-no">{item.sampleNo||"?"}</div>
      <div className="sq-name">{item.styleName||"Unknown style"}</div>
      <div className="sq-row">
        <div className="sq-brand">{item.brand||""} {item.cat||""}</div>
        <div className={"sq-st "+item.status}>{item.status}</div>
      </div>
    </div>
  );
}

    const id=newId();

  // Boot message
  useEffect(()=>{
    addMsg({role:"bot",text:"Hello! I'm the FROO.studio Tech Pack Bot.\n\nI watch a Slack channel for new sample submissions, build complete tech packs using AI, and post them back to Slack as a canvas in a dedicated channel named after the sample number.\n\nTo start: /monitor #channel-name\n\nOther commands:\n  /status — connection status\n  /help   — list commands\n\nOr just ask me anything about your samples."});
    if(CFG.SOURCE_CHANNEL&&CFG.SLACK_TOKEN){
      setTimeout(()=>startMonitoring(CFG.SOURCE_CHANNEL),600);
    }
  },[]);

  async function startMonitoring(channelInput){
    const channelName=channelInput.replace(/^#/,"").trim();
    if(!channelName)return;
    const id=addMsg({role:"bot",loading:true,text:"Connecting to #"+channelName+"..."});
    try{
      const chId=await slackFindChannel(channelName);
      sourceIdRef.current=chId;
      setSourceChannel(channelName);
      // Snapshot current latest ts so we only react to new messages
      const msgs=await slackGetHistory(chId,"0");
      if(msgs.length)lastTsRef.current=msgs[msgs.length-1].ts;
      setPolling(true);
      updateMsg(id,{loading:false,text:`Connected to #${channelName} ✓\n\nI'm now monitoring for new sample submissions. I'll check every 30 seconds.\n\nExpected message format:\n  Sample No: B106\n  Style: Lily Dress\n  Brand: Froo | Girls | 4Y | SS27\n  Colorway: White/Blue\n  Description: ...\n  [attach inspiration image]\n\nI'll parse the message, build the tech pack, and create a canvas in a new #${channelName}-style channel.`});
    }catch(e){
      updateMsg(id,{loading:false,text:"Could not connect: "+e.message+"\n\nMake sure the bot token has channels:read and the bot is invited to the channel."});
    }
  }

  // Polling effect
  useEffect(()=>{
    if(!polling)return;
    async function tick(){
      if(!sourceIdRef.current)return;
      try{
        const msgs=await slackGetHistory(sourceIdRef.current,lastTsRef.current);
        for(const m of msgs){
          if(parseFloat(m.ts)<=parseFloat(lastTsRef.current))continue;
          lastTsRef.current=m.ts;
          if((m.text||"").length>15&&!m.subtype){
            queueSample(m);
          }
        }
      }catch(e){console.warn("Poll error:",e.message);}
    }
    const timer=setInterval(tick,POLL_INTERVAL);
    return()=>clearInterval(timer);
  },[polling]);

  async function queueSample(slackMsg){
    if(processingRef.current){
      addMsg({role:"system",text:"New message queued — will process after current sample."});
    }
    const notifId=addMsg({role:"bot",text:"New message in #"+sourceChannel+" — parsing sample data..."});
    const parsed=await parseSampleMessage(slackMsg.text||"").catch(()=>null);
    if(!parsed||!parsed.sampleNo){
      updateMsg(notifId,{text:"Message in #"+sourceChannel+" doesn't look like a sample — skipping.\n\n\""+((slackMsg.text||"").slice(0,100))+"…\""});
      return;
    }
    let inspoB64=null,inspoMime=null;
    if(slackMsg.files&&slackMsg.files.length>0){
      const f=slackMsg.files.find(f=>f.mimetype&&f.mimetype.startsWith("image/"));
      if(f){
        try{
          const result=await slackDownloadAsB64(f.url_private);
          inspoB64=result.b64;
          inspoMime=f.mimetype||result.mime;
        }catch(e){console.warn("Image download failed:",e.message);}
      }
    }
    const sample={
      id:Date.now(),
      sampleNo:parsed.sampleNo,
      styleName:parsed.styleName||"",
      brand:parsed.brand||"",
      cat:parsed.cat||"",
      sz:parsed.sz||"",
      season:parsed.season||"",
      colorway:parsed.colorway||"",
      desc:parsed.desc||"",
      inspoB64,inspoMime,
      status:"pending",
    };
    setSamples(p=>[...p,sample]);
    setSelectedId(sample.id);
    updateMsg(notifId,{text:`Sample detected: ${parsed.sampleNo} — ${parsed.styleName}\nBrand: ${parsed.brand||"?"} | ${parsed.cat||"?"} | Size ${parsed.sz||"?"} | ${parsed.season||"?"}\n${inspoB64?"Inspiration image downloaded ✓":"No image attached"}\n\nProcessing now...`});
    await runPipeline(sample);
  }

  async function runPipeline(sample){
    if(processingRef.current){
      addMsg({role:"system",text:"Queued: "+sample.sampleNo+" will process after current job."});
      // Simple sequential wait
      while(processingRef.current)await new Promise(r=>setTimeout(r,2000));
    }
    processingRef.current=true;
    setSamples(p=>p.map(s=>s.id===sample.id?{...s,status:"processing"}:s));

    const stepsState={sketch:"pending",descriptions:"pending",image:"pending",chart:"pending",notes:"pending",channel:"pending",canvas:"pending"};
    const pid=addMsg({role:"bot",text:`Building tech pack for ${sample.sampleNo} — ${sample.styleName}`,steps:{...stepsState},activeStep:"sketch"});

    function logStep(key){
      // Mark previous active as done, set new active
      Object.keys(stepsState).forEach(k=>{if(stepsState[k]==="active")stepsState[k]="done";});
      stepsState[key]="active";
      updateMsg(pid,{steps:{...stepsState},activeStep:key});
    }
    function doneStep(key){stepsState[key]="done";}

    try{
      logStep("sketch");
      const tp=await buildTechPack(sample,(key)=>{
        doneStep(Object.keys(stepsState).find(k=>stepsState[k]==="active")||"sketch");
        logStep(key);
      });

      logStep("channel");
      const chName=slackChannelName(sample.sampleNo,sample.styleName);
      const channelId=await slackCreateOrFindChannel(chName);

      logStep("canvas");
      const markdown=buildCanvasMarkdown(sample,tp);
      let canvasId=null;
      try{
        canvasId=await slackCreateCanvas(channelId,"Tech Pack: "+sample.sampleNo+" — "+sample.styleName,markdown);
      }catch(e){
        console.warn("Canvas not available:",e.message);
      }

      // Always post a summary message
      await slackPostMessage(channelId,
        `:shirt: *Tech Pack: ${sample.sampleNo} — ${sample.styleName}*\n`+
        `*Brand:* ${sample.brand||"--"} | *Category:* ${sample.cat||"--"} | *Size:* ${sample.sz||"--"} | *Season:* ${sample.season||"--"}\n`+
        (canvasId?`\nCanvas created above ↑`:`\nSee full tech pack below ↓`)
      );

      if(!canvasId){
        // Fallback: post tech pack content directly
        const chunks=markdown.match(/[\s\S]{1,3000}/g)||[];
        for(const chunk of chunks.slice(0,4)){
          await slackPostMessage(channelId,chunk);
        }
      }

      Object.keys(stepsState).forEach(k=>stepsState[k]="done");
      updateMsg(pid,{
        text:`Tech pack complete! ✓\n\n${sample.sampleNo} — ${sample.styleName}\n${canvasId?"Canvas created":"Posted"} in #${chName}`,
        steps:{...stepsState},activeStep:null,loading:false,
      });
      setSamples(p=>p.map(s=>s.id===sample.id?{...s,status:"done"}:s));
    }catch(e){
      Object.keys(stepsState).forEach(k=>{if(stepsState[k]==="active")stepsState[k]="error";});
      updateMsg(pid,{
        text:`Error processing ${sample.sampleNo}: ${e.message}`,
        steps:{...stepsState},activeStep:null,loading:false,
      });
      setSamples(p=>p.map(s=>s.id===sample.id?{...s,status:"error"}:s));
    }
    processingRef.current=false;
  }

  async function submit(){
    const txt=input.trim();
    if(!txt)return;
    setInput("");

    if(txt.startsWith("/monitor")){
      const ch=txt.slice(8).trim();
      if(ch)await startMonitoring(ch);
      else addMsg({role:"bot",text:"Usage: /monitor #channel-name"});
      return;
    }
    if(txt==="/status"){
      addMsg({role:"user",text:txt});
      addMsg({role:"bot",text:`Status:\n• Slack token: ${CFG.SLACK_TOKEN?"Configured":"Not configured"}\n• Gemini: ${CFG.GEMINI_KEY?"Configured":"Not configured"}\n• Claude: Configured\n• Monitoring: ${polling?"#"+sourceChannel+" (active)":"Not started"}\n• Samples processed: ${samples.filter(s=>s.status==="done").length} / ${samples.length}\n• Processing now: ${processingRef.current?"Yes":"No"}`});
      return;
    }
    if(txt==="/help"){
      addMsg({role:"user",text:txt});
      addMsg({role:"bot",text:`Commands:\n  /monitor #channel  — Start watching a Slack channel\n  /status            — Show connection & queue status\n  /help              — Show this help\n\nOr type any question and I'll answer it.`});
      return;
    }

    addMsg({role:"user",text:txt});
    const rid=addMsg({role:"bot",loading:true,text:""});
    const r=await callClaude(
      [{role:"user",content:txt}],
      "You are the FROO.studio Tech Pack Bot assistant. Help with fashion tech pack questions, garment construction, sample management, and the FROO.studio workflow. Be concise and helpful."
    ).catch(()=>"Sorry, I couldn't reach Claude right now.");
    updateMsg(rid,{loading:false,text:r});
  }

  const connected={slack:CFG.SLACK_TOKEN!=="",gemini:CFG.GEMINI_KEY!==""};

  return(
    <>
      <style>{CSS}</style>
      <div className="app">
        <div className="topbar">
          <div className="logo">FROO<em>.</em>studio <span className="logo-sub">Tech Pack Bot</span></div>
          <div className="status-bar">
            <div className={"status-dot"+(polling?" active":"")}/>
            <div className={"status-txt"+(polling?" active":"")}>
              {polling?"Monitoring #"+sourceChannel:"Not monitoring"}
            </div>
            <div className={"api-chip "+(connected.slack?"ok":"no")}>Slack</div>
            <div className={"api-chip "+(connected.gemini?"ok":"no")}>Gemini</div>
          </div>
        </div>
        <div className="body">
          <div className="sidebar">
            <div className="sb-hdr">
              <span>Sample Queue</span>
              <span className="sb-count">{samples.length}</span>
            </div>
            <div className="queue">
              {samples.length===0&&(
                <div className="sq-empty">No samples yet.<br/>Monitoring #{sourceChannel||"..."}<br/>for new submissions.</div>
              )}
              {[...samples].reverse().map(s=>(
                <SampleItem key={s.id} item={s} active={selectedId===s.id} onClick={()=>setSelectedId(s.id)}/>
              ))}
            </div>
          </div>
          <div className="chat">
            <div className="msgs">
              {messages.map(m=><MsgBubble key={m.id} msg={m}/>)}
              <div ref={endRef}/>
            </div>
            <div className="input-bar">
              <input
                className="chat-input"
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&input.trim()&&submit()}
                placeholder={polling?`Monitoring #${sourceChannel} — type /help for commands`:"/monitor #channel-name to start"}
              />
              <button className="send-btn" onClick={submit} disabled={!input.trim()}>Send</button>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
