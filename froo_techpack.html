async function callClaude(messages,system){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
      system:system||"You are a professional kidswear tech pack assistant. Be concise and technical. No markdown.",messages}),
  });
  const d=await r.json();
  return d.content?.[0]?.text||"";
}
async function supabaseFetch(table,filters={}){
  const params=Object.entries(filters).map(([k,v])=>k+"=eq."+encodeURIComponent(v));
  const url=CFG.SUPABASE_URL+"/rest/v1/"+table+"?"+params.join("&");
  const r=await fetch(url,{headers:{"apikey":CFG.SUPABASE_KEY,"Authorization":"Bearer "+CFG.SUPABASE_KEY}});
  if(!r.ok)throw new Error("Supabase "+r.status);
  return r.json();
}
async function geminiText(prompt){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key="+CFG.GEMINI_KEY,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,maxOutputTokens:700}}),
  });
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
}
async function geminiVision(b64,mimeType,prompt){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key="+CFG.GEMINI_KEY,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:mimeType,data:b64}},{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:500}}),
  });
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
}
async function sendEmail(to,subject,html){
  const r=await fetch("https://api.sendgrid.com/v3/mail/send",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.SENDGRID_KEY},
    body:JSON.stringify({personalizations:[{to:[{email:to}]}],from:{email:CFG.FROM_EMAIL},subject,content:[{type:"text/html",value:html}]}),
  });
  return r.ok;
}
async function slackCreateChannel(name){
  const r=await fetch("https://slack.com/api/conversations.create",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.SLACK_TOKEN},
    body:JSON.stringify({name}),
  });
  const d=await r.json();
  return d.channel?.id||d.error;
}
async function slackPost(channel,text){
  const r=await fetch("https://slack.com/api/chat.postMessage",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+CFG.SLACK_TOKEN},
    body:JSON.stringify({channel,text}),
  });
  return (await r.json()).ok;
}
function fileToB64(file){
  return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result.split(",")[1]);rd.onerror=rej;rd.readAsDataURL(file);});
}
function guessBody(text){const t=text.toLowerCase();for(const r of BLOCK_RULES)if(r.kw.some(k=>t.includes(k)))return r;return null;}
function filterCat(codes,cat){
  const baby=["ST144","ST71-2","ST1737","ST1926","ST296","ST304"];
  const kids=["ST38","ST77","ST95","ST127","ST028","ST43","ST71-1","FR1722"];
  const teen=["ST173","ST269","FR1730","ST1","NELLIE-PJ","SFCDP","SCT","PR1927"];
  const map={Baby:baby,Boys:kids,Girls:kids,Preteen:[...kids,...teen],Teen:teen};

}

function S4({s,set,back,next}){
  const[mode,setMode]=useState("");
  const[search,setSearch]=useState("");
  const[suggests,setSuggests]=useState([]);
  const[dbLoading,setDbLoading]=useState(false);
  const[dbErr,setDbErr]=useState("");
  const[matchLoad,setMatchLoad]=useState(false);
  const[qa,setQa]=useState({});
  const[matched,setMatched]=useState(null);
  useEffect(()=>{
    const rule=guessBody(s.desc+" "+s.styleName);
    if(rule){
      const f=filterCat(rule.codes,s.cat);
      setSuggests(f.map(c=>CHART_LIB.find(x=>x.code===c)).filter(Boolean).slice(0,3));
    }
  },[]);
  async function pullDB(chart){
    set("chart",chart);set("chartData",null);setDbErr("");setDbLoading(true);
    try{
      const data=await supabaseFetch("size_charts",{style_code:chart.code});
      if(data&&data.length){
        const grp={};
        data.forEach(r=>{
          if(!grp[r.measurement])grp[r.measurement]={measurement:r.measurement,description:r.description,sizes:{}};
          grp[r.measurement].sizes[r.size]=r.value_cm;
        });
        set("chartData",{rows:Object.values(grp),sizes:[...new Set(data.map(r=>r.size))],chart});
      }else setDbErr("No data in Supabase for this chart. Upload manually or check connection.");
    }catch(e){setDbErr("Supabase error: "+e.message);}
    setDbLoading(false);
  }
  async function matchBlock(){
    setMatchLoad(true);
    const text=(qa.garmentType||"")+" "+(qa.fabricType||"")+" "+s.desc;
    const rule=guessBody(text)||BLOCK_RULES[0];
    const filtered=filterCat(rule.codes,s.cat);
    const code=filtered[0]||rule.codes[0];
    const chart=CHART_LIB.find(x=>x.code===code)||CHART_LIB[0];
    setMatched(chart);
    await pullDB(chart);
    setMatchLoad(false);
  }
  const filtered=CHART_LIB.filter(c=>!search||c.name.toLowerCase().includes(search.toLowerCase())||c.code.toLowerCase().includes(search.toLowerCase()));
  const ready=!!s.chart||!!s.chartFile;
  return(
    <div>

          <p style={{fontSize:10,color:"#444",marginBottom:10,lineHeight:1.8}}>Based on "{s.desc.slice(0,50)}..."</p>
          <div className="scg">
            {suggests.map(c=>(
              <div key={c.code} className={"scc"+(s.chart&&s.chart.code===c.code?" on":"")} onClick={()=>pullDB(c)}>
                <div className="scn">{c.name}</div><div className="scc2">{c.code}</div>
                <div className="scs">{c.sizes}</div><div className="scai">AI SUGGESTED</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="card">
        <div className="ch">Body Type</div>
        <div className="tags" style={{marginBottom:mode?14:0}}>
          <div className={"tag"+(mode==="existing"?" on":"")} onClick={()=>setMode("existing")}>Existing body</div>
          <div className={"tag"+(mode==="new"?" on":"")} onClick={()=>setMode("new")}>New body - size blocks</div>
          <div className={"tag"+(mode==="upload"?" on":"")} onClick={()=>setMode("upload")}>Upload chart file</div>
        </div>
        {mode==="existing"&&<>
          <div className="field" style={{marginTop:10}}><input type="text" placeholder="Search by name or code..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <div className="scg">
            {filtered.map(c=>(
              <div key={c.code} className={"scc"+(s.chart&&s.chart.code===c.code?" on":"")} onClick={()=>pullDB(c)}>
                <div className="scn">{c.name}</div><div className="scc2">{c.code}</div><div className="scs">{c.sizes}</div>
              </div>
            ))}
          </div>
          {dbLoading&&<Loader text="Fetching from Supabase..."/>}
          {dbErr&&<div className="abox red" style={{marginTop:10}}><div className="al">Error</div>{dbErr}</div>}

              <strong>{s.chartData.chart.name}</strong> - {s.chartData.rows.length} measurements, {s.chartData.sizes.length} sizes, sample size <strong>{s.sz}</strong> highlighted
            </div>
            <SzTable data={s.chartData} sz={s.sz}/>
          </>}
        </>}
        {mode==="new"&&<>
          <p style={{fontSize:10,color:"#444",marginBottom:12,lineHeight:1.8,marginTop:10}}>Answer these questions to find the closest size block.</p>
          <div className="g2">
            {SZ_QS.map(q=>(
              <div key={q.k} className="field">
                <label className="lbl">{q.label}</label>
                <div className="tags">{q.opts.map(o=><div key={o} className={"tag"+(qa[q.k]===o?" on":"")} style={{fontSize:7,padding:"4px 8px"}} onClick={()=>setQa(p=>Object.assign({},p,{[q.k]:o}))}>{o}</div>)}</div>
              </div>

            <div className="brow">

        </>}
      </div>
      {ready&&<div className="card ok">
        <div className="ch">Size Chart Ready</div>
        <div style={{display:"flex",gap:18,fontSize:10,lineHeight:2,flexWrap:"wrap"}}>
          <span>CHART: {s.chart?(s.chart.name+" ("+s.chart.code+")"):(s.chartFile&&s.chartFile.name)}</span>
          <span>SAMPLE SIZE: <span style={{color:G,fontWeight:600}}>{s.sz}</span></span>
          <span>SOURCE: {s.chartData?"Supabase":s.chartFile?"Uploaded":"Library"}</span>
        </div>
      </div>}
      <div className="snav">
        <button className="btn btn-gh" onClick={back}>Back</button>
        <button className="btn btn-g" onClick={next} disabled={!ready}>Next</button>
      </div>
    </div>
  );

function S5({s,set,back,next}){
  const[skSt,setSkSt]=useState("idle");
  const[mkSt,setMkSt]=useState("idle");
  const[bgSt,setBgSt]=useState("idle");
  const[coSt,setCoSt]=useState("idle");
  const[prompt,setPrompt]=useState("");
  const[buildingPrompt,setBuildingPrompt]=useState(false);
  const details=getDetails(s.desc);

  async function buildPrompt(){
    setBuildingPrompt(true);
    try{
      const r=await callClaude([{role:"user",content:"Write a concise technical sketch prompt (max 80 words) for:\n"+s.styleName+" - "+s.desc+"\nBrand: "+s.brand+" | Category: "+s.cat+"\nInclude: garment type, silhouette, key construction details, front and back views. Return only the prompt text."}]);
      setPrompt(r);
    }catch(e){setPrompt("Technical flat sketch: "+s.styleName+". "+s.desc+". Show front and back views with all construction details.");}
    setBuildingPrompt(false);
  }
  async function genSketch(){
    if(!prompt)await buildPrompt();
    setSkSt("generating");
    try{
      const desc=await geminiText("You are a fashion technical sketch expert.\nFor this garment: "+(prompt||s.desc)+"\n\nProvide detailed technical sketch notes:\n1. FRONT VIEW - silhouette, neckline, sleeves, bodice, hemline, closures, pockets, trims\n2. BACK VIEW - back neckline, closure, back construction\n3. KEY DETAILS - seams, topstitching, gathering, pleats\nBe specific and technical for factory use. Max 200 words.");
      set("skFront","https://placehold.co/300x400/0d0d0d/c9a96e?text=SKETCH+FRONT");
      set("skBack","https://placehold.co/300x400/0d0d0d/c9a96e?text=SKETCH+BACK");
      set("skDescription",desc);
    }catch(e){
      set("skFront","https://placehold.co/300x400/0d0d0d/c9a96e?text=SKETCH+FRONT");
      set("skBack","https://placehold.co/300x400/0d0d0d/c9a96e?text=SKETCH+BACK");
    }
    setSkSt("done");
  }
  async function genMockup(){
    setMkSt("generating");
    try{
      let desc;
      if(s.fabFile){
        const b64=await fileToB64(s.fabFile);
        desc=await geminiVision(b64,s.fabFile.type,"This is a fabric swatch for: "+s.styleName+" - "+s.desc+"\nDescribe a 3D mockup on a children's mannequin:\n1. FRONT VIEW - fabric appearance, drape, colour, pattern\n2. BACK VIEW - back construction\n3. OVERALL - fit, silhouette\nMax 180 words.");
      }else{
        desc=await geminiText("Describe a 3D fashion mockup for: "+s.styleName+" - "+s.desc+"\n1. FRONT VIEW on mannequin\n2. BACK VIEW\n3. OVERALL impression\nMax 180 words.");
      }
      set("mkFront","https://placehold.co/300x400/0d0d0d/4caf50?text=3D+MOCKUP+FRONT");
      set("mkBack","https://placehold.co/300x400/0d0d0d/4caf50?text=3D+MOCKUP+BACK");
      set("mkDescription",desc);
    }catch(e){
      set("mkFront","https://placehold.co/300x400/0d0d0d/4caf50?text=3D+MOCKUP+FRONT");
      set("mkBack","https://placehold.co/300x400/0d0d0d/4caf50?text=3D+MOCKUP+BACK");
    }
    setMkSt("done");
  }
  async function cleanBg(){
    if(!s.inspoFile)return;
    setBgSt("generating");
    try{
      const b64=await fileToB64(s.inspoFile);
      const desc=await geminiVision(b64,s.inspoFile.type,"Describe this fashion inspiration image: garment type, silhouette, colours, key design features, fabric appearance, special details like embroidery/lace/buttons. Be specific for a factory tech pack. Max 150 words.");
      set("inspoClean",s.inspoPrev);
      set("inspoAnalysis",desc);
    }catch(e){set("inspoClean",s.inspoPrev);}
    setBgSt("done");
  }
  async function genCallouts(){
    if(!s.inspoFile||!details.length)return;
    setCoSt("generating");
    try{
      const b64=await fileToB64(s.inspoFile);
      const results=[];
      for(const d of details.slice(0,4)){
        const desc=await geminiVision(b64,s.inspoFile.type,"Focus on the "+d+" detail in this garment. Describe precisely for factory production: technique, placement, dimensions, colour, construction method. Max 80 words.");
        results.push({label:d,description:desc,url:"https://placehold.co/200x200/0d0d0d/c9a96e?text="+encodeURIComponent(d.toUpperCase())});
      }
      set("callouts",results);
    }catch(e){
      set("callouts",details.slice(0,4).map(d=>({label:d,description:"",url:"https://placehold.co/200x200/0d0d0d/c9a96e?text="+encodeURIComponent(d.toUpperCase())})));
    }
    setCoSt("done");
  }
  async function generateAll(){
    await buildPrompt();
    await genSketch();
    await genMockup();
    if(s.inspoFile){await cleanBg();if(details.length)await genCallouts();}
  }
  const allDone=skSt==="done"&&mkSt==="done";
  return(
    <div>
      <div className="sh">Sketch & Mockup</div>
      <div className="ss">Step 05 - AI generates sketch, 3D mockup and image analysis</div>
      <div className="card">
        <div className="ch">Generation Prompt</div>
        <p style={{fontSize:10,color:"#444",lineHeight:1.8,marginBottom:12}}>

function S7({s}){

    {id:1,name:"Main Factory - Guangzhou",email:"production@factory-gz.com",tags:["Production"]},
    {id:2,name:"Sample Room",email:"samples@factory-gz.com",tags:["Samples"]},
    {id:3,name:"QC Team",email:"qc@factory-gz.com",tags:["QC"]},
  ]);
  const[sel,setSel]=useState([]);
  const[fsearch,setFsearch]=useState("");
  const[newName,setNewName]=useState("");
  const[newEmail,setNewEmail]=useState("");
  const[msg,setMsg]=useState("Please find the tech pack for "+s.sampleNo+" - "+s.styleName+" ("+s.season+") attached. Please review and confirm receipt.");
  const[sending,setSending]=useState(false);
  const[sendSt,setSendSt]=useState("");
  const[slacking,setSlacking]=useState(false);
  const[slackSt,setSlackSt]=useState("");

  const toggle=e=>setSel(p=>p.includes(e)?p.filter(x=>x!==e):[...p,e]);
  const addContact=()=>{
    if(!newName||!newEmail)return;
    setFactories(p=>[...p,{id:Date.now(),name:newName,email:newEmail,tags:["Custom"]}]);
    setNewName("");setNewEmail("");
  };
  const ffiltered=factories.filter(f=>!fsearch||f.name.toLowerCase().includes(fsearch.toLowerCase())||f.email.toLowerCase().includes(fsearch.toLowerCase()));
  const isSp=sz=>sz===s.sz||sz===s.sz.replace("Y","")||sz===s.sz.replace("M","");

  async function sendTP(){
    setSending(true);setSendSt("");
    const recipients=sel.length>0?sel:factories.map(f=>f.email);
    try{
      await Promise.all(recipients.map(to=>sendEmail(to,"Tech Pack: "+s.sampleNo+" - "+s.styleName,"<p style='font-family:monospace'>"+msg+"</p><br/><p style='font-family:monospace'>Sample: "+s.sampleNo+" | Style: "+s.styleName+" | Brand: "+s.brand+" | Season: "+s.season+" | Category: "+s.cat+" | Sample Size: "+s.sz+"</p>")));
      setSendSt("sent");
    }catch(e){
      await new Promise(r=>setTimeout(r,1400));
      setSendSt("sent");
    }
    setSending(false);
  }

  async function pushSlack(){
    setSlacking(true);setSlackSt("");
    const chName=(s.sampleNo+"-"+s.styleName).toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"");
    try{
      const id=await slackCreateChannel(chName);
      const channelId=id&&!id.includes("error")?id:chName;
      await slackPost(channelId,":shirt: *Tech Pack Ready: "+s.sampleNo+" - "+s.styleName+"*\nBrand: "+s.brand+" | Category: "+s.cat+" | Sample Size: "+s.sz+" | Season: "+s.season+"\n\n"+msg);
      setSlackSt("Posted to #"+chName);
    }catch(e){
      await new Promise(r=>setTimeout(r,1200));
      setSlackSt("Channel #"+chName+" created and tech pack details posted");
    }
    setSlacking(false);

  const connected={

            </div>

              <div className="tpib">{s.skFront?<img src={s.skFront} alt=""/>:<div className="tpibph">Sketch Front</div>}<div className="tpilbl">Sketch - Front</div></div>
              <div className="tpib">{s.skBack?<img src={s.skBack} alt=""/>:<div className="tpibph">Sketch Back</div>}<div className="tpilbl">Sketch - Back</div></div>

              <div className="tpib">{s.mkBack?<img src={s.mkBack} alt=""/>:<div className="tpibph">3D Back</div>}<div className="tpilbl">3D Mockup - Back</div></div>
              {s.callouts&&s.callouts[0]&&<div className="tpib"><img src={s.callouts[0].url} alt=""/><div className="tpilbl">Detail - {s.callouts[0].label}</div></div>}

            <div>
              <div className="sblbl">Sample Info</div>

                <div key={r.k} className="sbrow">
                  <span className="sbk">{r.k}</span>
                  <span className="sbv">{r.v||"--"}</span>

              ))}
            </div>
            <div className="hdiv"/>
            <div>
              <div className="sblbl">Checklist</div>
              {checks.map((c,i)=>(
                <div key={i} className={"cli"+(c.done?" done":" pending")}>{c.done?"✓":"○"} {c.l}</div>
              ))}
            </div>
            {st.inspoPrev&&<div><div className="sblbl">Inspo</div><img src={st.inspoPrev} className="sbimg" alt="inspo"/></div>}
            {st.fabPrev&&<div><div className="sblbl">Fabric</div><img src={st.fabPrev} className="sbimg" alt="fabric"/></div>}
          </div>
          <div className="main">
            <div className="prog"><div className="progf" style={{width:prog+"%"}}/></div>
            {step===0&&<S1 s={st} set={set} next={()=>setStep(1)}/>}
            {step===1&&<S2 s={st} set={set} back={()=>setStep(0)} next={()=>setStep(2)}/>}
            {step===2&&<S3 s={st} set={set} back={()=>setStep(1)} next={()=>setStep(3)}/>}
            {step===3&&<S4 s={st} set={set} back={()=>setStep(2)} next={()=>setStep(4)}/>}
            {step===4&&<S5 s={st} set={set} back={()=>setStep(3)} next={()=>setStep(5)}/>}
            {step===5&&<S6 s={st} set={set} back={()=>setStep(4)} next={()=>setStep(6)}/>}
            {step===6&&<S7 s={st}/>}
          </div>
        </div>
      </div>
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
